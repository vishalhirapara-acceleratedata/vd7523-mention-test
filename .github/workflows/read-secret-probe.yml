name: read-secret-probe
on: push
jobs:
  no-env:
    runs-on: ubuntu-latest
    steps:
      - run: 'if [ -n "$P" ]; then echo "SECRET_VISIBLE len=${#P}"; else echo "SECRET_EMPTY"; fi'
        env:
          P: ${{ secrets.VIBEDATA_PAT_253425613 }}
  with-env:
    runs-on: ubuntu-latest
    environment: vibedata-mention
    steps:
      - run: 'if [ -n "$P" ]; then echo "SECRET_VISIBLE len=${#P}"; else echo "SECRET_EMPTY"; fi'
        env:
          P: ${{ secrets.VIBEDATA_PAT_253425613 }}
